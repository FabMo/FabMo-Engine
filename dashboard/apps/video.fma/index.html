<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Camera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            height: 100vh;
            overflow: hidden;
        }

        body {
            background: #000;
            position: fixed;
            width: 100vw;
            height: 100vh;
        }

        #video-viewport {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #camera1, #camera2 {
            width: 100%;
            height: 100%;
            object-fit: fill; /* Use 'cover' or 'contain' to maintain aspect ratio rather than 'fill' */
        }

        #cam-label {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 100;
            font-family: sans-serif;
            background: rgba(0,0,0,0.7);
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 14px;
        }

        /* AR calibration + live overlay */
        #cam-toolbar {
            position: absolute;
            top: 10px;
            right: 10px;
            z-index: 110;
            display: flex;
            gap: 8px;
        }
        .cam-btn {
            background: rgba(0,0,0,0.7);
            color: #fff;
            border: 1px solid rgba(255,255,255,0.35);
            border-radius: 4px;
            font-family: sans-serif;
            font-size: 14px;
            padding: 8px 12px;
            cursor: pointer;
        }
        .cam-btn:hover { border-color: #fff; }
        .cam-btn.active { background: #2980b9; border-color: #2980b9; }
        /* Warped grids: SVG coordinates map onto the table quad via matrix3d */
        #live-grid, #cal-grid {
            position: absolute;
            top: 0;
            left: 0;
            transform-origin: 0 0;
            pointer-events: none;
            z-index: 50;
        }
        .cal-handle {
            position: absolute;
            width: 32px;
            height: 32px;
            margin: -16px 0 0 -16px;
            border-radius: 50%;
            border: 2px solid #fff;
            background: rgba(41,128,185,0.55);
            box-shadow: 0 0 6px rgba(0,0,0,0.6);
            z-index: 60;
            cursor: grab;
            touch-action: none;
        }
        /* Edge-midpoint (barrel correction) handles: smaller diamonds. They
           mark where each table edge's midpoint actually appears when lens
           distortion bows the edges; untouched they track the projective
           (no-bow) midpoints. */
        .cal-handle.edge {
            width: 22px;
            height: 22px;
            margin: -11px 0 0 -11px;
            border-radius: 4px;
            transform: rotate(45deg);
            background: rgba(243,156,18,0.6);
        }
        /* Screen-space ring through corners + edge midpoints: shows the bow
           directly over the video during calibration. */
        #cal-ring {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            z-index: 58;
            pointer-events: none;
        }
        #cal-ring polygon {
            fill: rgba(255,60,60,0.08);
            stroke: #ff3c3c;
            stroke-width: 0.003;
            stroke-linejoin: round;
        }
        .cal-handle.loupe-active { opacity: 0; }
        #cal-loupe {
            position: absolute;
            width: 148px;
            height: 148px;
            margin: -74px 0 0 -74px;
            border-radius: 50%;
            border: 3px solid #fff;
            overflow: hidden;
            z-index: 70;
            pointer-events: none;
            box-shadow: 0 4px 14px rgba(0,0,0,0.6);
            display: none;
            background: #000;
        }
        #cal-loupe canvas { width: 100%; height: 100%; display: block; }
        /* Stitched gantry-free photo of the table, shown under the grid in
           table view. Positioned to the table rect by script. */
        #plate-view {
            position: absolute;
            z-index: 40;
            display: none;
        }
        #cal-bar, #zone-bar, #scan-bar {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 10px;
            align-items: center;
            z-index: 80;
            background: rgba(0,0,0,0.7);
            padding: 10px 14px;
            border-radius: 6px;
            color: #fff;
            font-family: sans-serif;
            font-size: 14px;
            white-space: nowrap;
        }
        #scan-bar, #cal-bar {
            max-width: min(560px, 92vw);
            white-space: normal;
        }

        /* Keep-out zones: red wash on the warped grid; the capture layer
           takes the drawing input while zone edit mode is open */
        #zone-capture {
            position: absolute;
            inset: 0;
            z-index: 55;
            display: none;
            cursor: crosshair;
            touch-action: none;
        }
        .ko-zone {
            fill: rgba(231,76,60,0.28);
            stroke: #c0392b;
            stroke-width: 2;
            vector-effect: non-scaling-stroke;
        }
        .ko-draft {
            fill: rgba(231,76,60,0.15);
            stroke-dasharray: 6,4;
        }
    </style>
</head>
<body>
    <div id="video-viewport">
        <img id="camera1" />
        <img id="camera2" />
        <img id="plate-view" />
        <div id="cam-label">Loading cameras...</div>
        <div id="cam-toolbar">
            <button class="cam-btn" id="btn-grid" style="display:none;">Grid</button>
            <button class="cam-btn" id="btn-zones" style="display:none;">Keep-Out</button>
            <button class="cam-btn" id="btn-scan" style="display:none;">Scan Table</button>
            <button class="cam-btn" id="btn-view" style="display:none;">Table View</button>
            <button class="cam-btn" id="btn-calibrate" style="display:none;">Calibrate AR</button>
        </div>
        <svg id="live-grid" style="display:none;"></svg>
        <svg id="cal-grid" style="display:none;"></svg>
        <svg id="cal-ring" viewBox="0 0 1 1" preserveAspectRatio="none" style="display:none;"><polygon points=""/></svg>
        <div class="cal-handle" data-corner="tl" style="display:none;"></div>
        <div class="cal-handle" data-corner="tr" style="display:none;"></div>
        <div class="cal-handle" data-corner="br" style="display:none;"></div>
        <div class="cal-handle" data-corner="bl" style="display:none;"></div>
        <div class="cal-handle edge" data-corner="tm" style="display:none;"></div>
        <div class="cal-handle edge" data-corner="rm" style="display:none;"></div>
        <div class="cal-handle edge" data-corner="bm" style="display:none;"></div>
        <div class="cal-handle edge" data-corner="lm" style="display:none;"></div>
        <div id="cal-loupe"><canvas></canvas></div>
        <div id="cal-bar" style="display:none;">
            <span>Drag the corners onto the table corners &mdash; if the table edges look bowed, drag the diamond handles onto the middle of each edge</span>
            <button class="cam-btn" id="btn-cal-save">Save</button>
            <button class="cam-btn" id="btn-cal-cancel">Cancel</button>
        </div>
        <div id="zone-capture"></div>
        <div id="scan-bar" style="display:none;">
            <span id="scan-msg"></span>
            <button class="cam-btn" id="btn-scan-start">Start</button>
            <button class="cam-btn" id="btn-scan-stop" style="display:none;">Stop</button>
            <button class="cam-btn" id="btn-scan-cancel">Cancel</button>
        </div>
        <div id="zone-bar" style="display:none;">
            <span id="zone-hint">Drag a rectangle around the obstacle</span>
            <button class="cam-btn" id="btn-zone-rect">Rectangle</button>
            <button class="cam-btn" id="btn-zone-draw">Freehand</button>
            <button class="cam-btn" id="btn-zone-erase">Erase</button>
            <button class="cam-btn" id="btn-zone-done">Done</button>
        </div>
    </div>

    <script src="../../static/js/shared-video.js?v=3"></script>
    <script src="../../video.js?v=151"></script></body>

</html>
