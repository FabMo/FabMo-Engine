<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remote Support</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="rs-page">
    <h1>Remote Support</h1>

    <div class="rs-card">
        <!-- one of these three is shown at a time -->
        <button class="rs-btn rs-primary rs-big" id="btn-request" hidden>Get a code for remote support</button>

        <div id="waiting" hidden>
            <div class="rs-code" id="wait-code"></div>
            <div class="rs-status" id="wait-text"></div>
            <button class="rs-btn" id="btn-cancel">Cancel</button>
        </div>

        <div id="open" hidden>
            <div class="rs-status rs-on" id="open-text"></div>
            <button class="rs-btn rs-primary rs-big" id="btn-elevate">Grant Full Access</button>
            <div class="rs-status" id="elevated" hidden>Full access granted</div>
            <button class="rs-btn rs-stop rs-big" id="btn-stop">End session</button>
        </div>

        <div class="rs-msg" id="msg"></div>
    </div>
</div>

<script src="../../js/libs/fabmo.js"></script>
<script src="js/app.js"></script>
</body>
</html>
